<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{{ info.title if info else '映画情報' }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Arial', sans-serif;
        }
        .movie-card {
            background-color: #fff;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-top: 2rem;
        }
        .movie-poster {
            max-width: 200px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="movie-card row">
            <div class="col-md-4">
                <img src="https://image.tmdb.org/t/p/w500{{ info.poster_path }}" alt="ポスター" class="movie-poster img-fluid">
            </div>
            <div class="col-md-8">
                <h1>{{ info.title }} ({{ info.year }})</h1>
                <p><strong>ジャンル:</strong> {{ info.genres | join(', ') }}</p>
                <p><strong>評価:</strong> {{ info.rating }}</p>
                <p><strong>あらすじ:</strong><br>{{ info.overview }}</p>
                <p><strong>監督:</strong> {{ info.director }}</p>
<a href="/" class="btn btn-primary mt-3">検索ページに戻る</a>
            </div>
        </div>

        {% if info.recommendations %}
        <div class="mt-5">
            <h4>おすすめ映画</h4>
            <ul>
                {% for rec in info.recommendations %}
                <li>{{ rec }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
    </div>
</body>
</html>
